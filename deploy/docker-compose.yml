# نظام مستشفى سويد — تشغيل دائم على سيرفر المستشفى.
# الاستخدام: انسخ .env.example إلى .env وعدّل كلمات المرور، ثم: docker compose up -d --build
name: soued-hms

x-backend: &backend
  image: ghcr.io/ohcnetwork/care:latest
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Damascus
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: docker.io/pgsty/silo:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${BUCKET_KEY}
      MINIO_ROOT_PASSWORD: ${BUCKET_SECRET}
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - minio-data:/data
      - ./minio/init-script.sh:/init-script.sh:ro
      - ./minio/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports: ["9100:9000"] # ملفات المرضى (يجب أن يصلها المتصفح)

  backend:
    <<: *backend
    entrypoint: ["bash", "start.sh"]

  celery-worker:
    <<: *backend
    entrypoint: ["bash", "celery_worker.sh"]

  celery-beat:
    <<: *backend
    entrypoint: ["bash", "celery_beat.sh"]

  web:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: [backend]
    environment:
      REACT_CARE_API_URL: "" # نفس العنوان: nginx يمرّر /api إلى الخادم الخلفي
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["${WEB_PORT:-80}:80"]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Damascus
    volumes: [./backups:/backups, ./backup.sh:/backup.sh:ro]
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  db-data:
  redis-data:
  minio-data:
