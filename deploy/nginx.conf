server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 100m;

  include mime.types;
  types { text/javascript js mjs; }

  location /api/   { proxy_pass http://backend:9000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/ { proxy_pass http://backend:9000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:9000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  location = /index.html { expires 6h; }
  location = /runtime-env.js { expires -1; }
  location / { expires 7d; try_files $uri $uri/ /index.html; }
}
